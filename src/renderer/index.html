<!doctype html>
<html lang="zh-CN" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="本地优先的 AI 视觉创作工作台" />
        <link rel="icon" href="/logo.svg" />
        <title>Unleashly</title>
        <style>
            html,
            body,
            #root {
                height: 100%;
                margin: 0;
            }
            body {
                background: #f4f2ed;
                color: #1c1917;
            }
            html.dark body {
                background: #181715;
                color: #f5f5f4;
            }
            #boot {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: grid;
                place-content: center;
                gap: 10px;
                padding: 24px;
                text-align: center;
                background: #f4f2ed;
                color: #1c1917;
                font-family: "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            }
            html.dark #boot {
                background: #181715;
                color: #f5f5f4;
            }
            .boot-mark {
                display: grid;
                place-items: center;
                width: 56px;
                height: 56px;
                margin: 0 auto 8px;
                border-radius: 16px;
                background: linear-gradient(135deg, #f97316, #fb923c);
                color: #181715;
                font-size: 28px;
                font-weight: 700;
            }
            .boot-title {
                font-size: 20px;
                font-weight: 600;
                letter-spacing: 0.02em;
            }
            .boot-text,
            .boot-message {
                max-width: 560px;
                color: #78716c;
                font-size: 13px;
                line-height: 1.7;
                white-space: pre-wrap;
            }
            html.dark .boot-text,
            html.dark .boot-message {
                color: #a8a29e;
            }
            .boot-error .boot-title {
                color: #b91c1c;
            }
            html.dark .boot-error .boot-title {
                color: #fca5a5;
            }
        </style>
        <script src="./theme-init.js"></script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="boot">
            <div class="boot-mark">U</div>
            <div class="boot-title">Unleashly</div>
            <div class="boot-text">正在加载本地工作台...</div>
            <div class="boot-message"></div>
        </div>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
